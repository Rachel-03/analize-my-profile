
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Profiling and Risk Assessment</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#003366;
}

.section{
    border-left:5px solid #0078d4;
    padding-left:15px;
    margin-bottom:25px;
}

.question{
    margin:15px 0;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

select{
    width:100%;
    padding:10px;
    border-radius:5px;
}

button{
    width:100%;
    padding:15px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

#result{
    margin-top:20px;
    padding:20px;
    background:#eef6ff;
    border-radius:10px;
}

#chartContainer{
    margin-top:20px;
    height:400px;
}
</style>
</head>

<body>

<div class="container">

<h1>Investor Profiling and Risk Assessment</h1>

<div class="section">
<h2>1. Traditional Risk Profiling</h2>

<div class="question">
<label>Age</label>
<select id="age">
<option value="1">60歲以上</option>
<option value="2">46-60歲</option>
<option value="3">36-45歲</option>
<option value="4">26-35歲</option>
<option value="5">18-25歲</option>
</select>
</div>

<div class="question">
<label>Income</label>
<select id="income">
<option value="1">3萬以下</option>
<option value="2">3-5萬</option>
<option value="3">5-10萬</option>
<option value="4">10-20萬</option>
<option value="5">20萬以上</option>
</select>
</div>

<div class="question">
<label>Wealth</label>
<select id="wealth">
<option value="1">10萬以下</option>
<option value="2">10-50萬</option>
<option value="3">50-100萬</option>
<option value="4">100-500萬</option>
<option value="5">500萬以上</option>
</select>
</div>

<div class="question">
<label>Investment Horizon</label>
<select id="horizon">
<option value="1">1年以下</option>
<option value="2">1-3年</option>
<option value="3">3-5年</option>
<option value="4">5-10年</option>
<option value="5">10年以上</option>
</select>
</div>

<div class="question">
<label>Financial Goal</label>
<select id="goal">
<option value="1">保本</option>
<option value="2">教育基金</option>
<option value="3">購屋規劃</option>
<option value="4">財富累積</option>
<option value="5">退休規劃</option>
</select>
</div>

<div class="question">
<label>Loss Capacity</label>
<select id="loss">
<option value="1">無法接受</option>
<option value="2">很難接受</option>
<option value="3">尚可接受</option>
<option value="4">可以接受</option>
<option value="5">完全可以接受</option>
</select>
</div>

<div class="question">
<label>Risk Tolerance</label>
<select id="tolerance">
<option value="1">非常保守</option>
<option value="2">保守</option>
<option value="3">中立</option>
<option value="4">積極</option>
<option value="5">非常積極</option>
</select>
</div>
</div>

<div class="section">
<h2>2. Behavioral & Emotional Assessment</h2>

<div class="question">
<label>投資組合下跌20%時，你會？</label>
<select id="emotion1">
<option value="1">全部賣出</option>
<option value="2">部分賣出</option>
<option value="3">持有觀察</option>
<option value="5">逢低加碼</option>
</select>
</div>

<div class="question">
<label>市場劇烈波動時，你的反應？</label>
<select id="emotion2">
<option value="1">非常焦慮</option>
<option value="2">有點擔心</option>
<option value="3">普通</option>
<option value="5">冷靜分析</option>
</select>
</div>

<div class="question">
<label>朋友推薦熱門股票時？</label>
<select id="emotion3">
<option value="1">直接跟單</option>
<option value="3">研究後決定</option>
<option value="5">依自己判斷</option>
</select>
</div>
</div>

<div class="section">
<h2>3. Financial Capacity</h2>

<div class="question">
<label>Liquidity Need</label>
<select id="liquidity">
<option value="1">一年內需要用到</option>
<option value="2">1-3年</option>
<option value="3">3-5年</option>
<option value="4">5年以上</option>
<option value="5">非常長期</option>
</select>
</div>

<div class="question">
<label>Liabilities</label>
<select id="debt">
<option value="1">高負債</option>
<option value="2">中高負債</option>
<option value="3">普通</option>
<option value="4">低負債</option>
<option value="5">無負債</option>
</select>
</div>
</div>

<button onclick="analyze()">Analyze My Profile</button>

<div id="result"></div>

<div id="chartContainer">
<canvas id="radarChart"></canvas>
</div>

</div>

<script>

let radarChart = null;

function analyze(){

const ids = [
"age","income","wealth","horizon","goal",
"loss","tolerance",
"emotion1","emotion2","emotion3",
"liquidity","debt"
];

let total = 0;

ids.forEach(id=>{
    total += parseInt(document.getElementById(id).value);
});

const score = Math.round((total/60)*100);

let type="";

if(score <= 30){
    type="Conservative Investor";
}
else if(score <= 60){
    type="Moderate Investor";
}
else if(score <= 80){
    type="Growth Investor";
}
else{
    type="Aggressive Investor";
}

let recommendation="";

if(type==="Conservative Investor"){
    recommendation="股票20%、ETF20%、債券50%、現金10%";
}
else if(type==="Moderate Investor"){
    recommendation="股票40%、ETF30%、債券20%、現金10%";
}
else if(type==="Growth Investor"){
    recommendation="股票60%、ETF20%、債券10%、現金10%";
}
else{
    recommendation="股票80%、ETF10%、債券5%、現金5%";
}

document.getElementById("result").innerHTML = `
<h2>Dynamic Investor Risk Profile</h2>
<p><strong>Baseline Risk Score:</strong> ${score}/100</p>
<p><strong>Investor Type:</strong> ${type}</p>
<p><strong>Personalized Recommendation:</strong></p>
<p>${recommendation}</p>
`;

const radarData = [
parseInt(document.getElementById("tolerance").value),
parseInt(document.getElementById("loss").value),
parseInt(document.getElementById("emotion2").value),
parseInt(document.getElementById("liquidity").value),
parseInt(document.getElementById("wealth").value)
];

const ctx = document.getElementById("radarChart");

if(radarChart){
    radarChart.destroy();
}

radarChart = new Chart(ctx,{
    type:'radar',
    data:{
        labels:[
            "Risk Tolerance",
            "Loss Capacity",
            "Emotional Stability",
            "Liquidity Need",
            "Financial Capacity"
        ],
        datasets:[{
            label:"Investor Profile",
            data:radarData,
            backgroundColor:"rgba(0,120,212,0.2)",
            borderColor:"#0078d4",
            borderWidth:2
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,
        scales:{
            r:{
                min:0,
                max:5,
                ticks:{
                    stepSize:1
                }
            }
        }
    }
});

}
</script>

</body>
</html>
